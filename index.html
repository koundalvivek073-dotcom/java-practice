<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banking Popup Website</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Banking App</h1>
      <p class="subtitle">Choose one of the 4 actions below.</p>

      <div class="card-grid">
        <button type="button" class="feature-card" data-action="checkbalance">
          <span class="icon">💰</span>
          <h3>Check Balance</h3>
          <p>View your current balance instantly.</p>
        </button>

        <button type="button" class="feature-card" data-action="deposit">
          <span class="icon">⬆️</span>
          <h3>Deposit</h3>
          <p>Deposit money into your account.</p>
        </button>

        <button type="button" class="feature-card" data-action="widraw">
          <span class="icon">⬇️</span>
          <h3>Widraw</h3>
          <p>Withdraw money from your account.</p>
        </button>

        <button type="button" class="feature-card exit-card" data-action="exit">
          <span class="icon">🚪</span>
          <h3>Exit</h3>
          <p>Leave the banking popup menu.</p>
        </button>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" hidden>
      <div class="modal-box" role="dialog" aria-modal="true">
        <button class="close-btn" id="closeModal" aria-label="Close">×</button>
        <h2 id="modalTitle">Action</h2>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
